name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Uses the provisioned Gradle distribution: the wrapper JAR is a binary
      # that has not been uploaded to this repository yet.
      - name: Lint, unit test, build
        run: gradle lint testDebugUnitTest assembleDebug --stacktrace

      - name: Upload reports and debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          retention-days: 7
          path: |
            **/build/reports/
            **/build/outputs/apk/debug/*.apk
