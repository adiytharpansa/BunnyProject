org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 8.5.2 officially supports compileSdk up to 34; Media3 1.5.1 needs 35.
android.suppressUnsupportedCompileSdk=35
# Bridge for the Kotlin 2.0 step: Hilt 2.51.1 and Room 2.6.1 processors run
# on the KSP1 API. KSP2 (with Hilt/Room bumps) arrives at the Kotlin 2.2 step.
ksp.useKSP2=false
