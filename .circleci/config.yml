# CircleCI — dapur kedua Bunny (ditetapkan pengguna 2026-11-12,
# hasil riset: menit sumber terbuka besar + tanpa kartu).
# Perintah verifikasi yang SAMA PERSIS dengan .github/workflows/ci.yml:
# lint + unit test + assembleDebug, keystore debug tetap direstorasi
# dari variabel rahasia, pasangan Desktop disuntik sebagai env.
# Rahasia hidup sebagai environment variable proyek di CircleCI,
# tidak pernah di berkas ini.

version: 2.1

jobs:
  verify:
    docker:
      - image: cimg/android:2025.09
    resource_class: medium
    environment:
      GRADLE_VERSION: "8.13"
    steps:
      - checkout

      - run:
          name: Set up Gradle 8.13
          command: |
            java -version
            curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
            sudo unzip -q /tmp/gradle.zip -d /opt
            echo 'export PATH="/opt/gradle-'"${GRADLE_VERSION}"'/bin:$PATH"' >> "$BASH_ENV"
            gradle --version

      - run:
          name: Install Android SDK platform 36
          command: |
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager "platforms;android-36"

      - run:
          name: Restore fixed debug keystore
          command: |
            if [ -n "$BUNNY_DEBUG_KEYSTORE_B64" ]; then
              echo "$BUNNY_DEBUG_KEYSTORE_B64" | base64 -d > bunny-debug.keystore
              echo "Fixed debug keystore restored."
            else
              echo "No fixed debug keystore secret; using ephemeral CI debug key."
            fi

      - run:
          name: Lint, unit test, build
          command: gradle lint testDebugUnitTest assembleDebug --stacktrace

      - run:
          name: Collect reports and debug APK
          when: always
          command: |
            mkdir -p /tmp/reports
            find . -type d -path '*/build/reports' -exec cp -r {} /tmp/reports/ \; || true
            find . -type f -path '*/build/outputs/apk/debug/*.apk' -exec cp {} /tmp/reports/ \; || true
            ls -la /tmp/reports/

      - store_artifacts:
          path: /tmp/reports
          destination: reports

workflows:
  verify:
    jobs:
      - verify
